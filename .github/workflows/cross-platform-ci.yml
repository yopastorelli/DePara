name: Cross-platform CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/windows-native-foundation

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22.x
          - 24.x
    env:
      DEPARA_DISABLE_UPDATE_SCHEDULER: 'true'
      DEPARA_DISABLE_PROCESS_HOOKS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  smoke:
    name: Smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      DEPARA_DISABLE_UPDATE_SIDE_EFFECTS: 'true'
      DEPARA_DISABLE_UPDATE_SCHEDULER: 'true'
      DEPARA_DISABLE_PROCESS_HOOKS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke tests
        run: npm run test:smoke

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high

  e2e-linux:
    name: Playwright E2E / Ubuntu
    runs-on: ubuntu-latest
    env:
      DEPARA_DISABLE_UPDATE_SIDE_EFFECTS: 'true'
      DEPARA_DISABLE_UPDATE_SCHEDULER: 'true'
      DEPARA_DISABLE_PROCESS_HOOKS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
